#
# Configuration file for 'install-agent.sh' of the 'gfarm_zabbix' package.
#

# Directory where commands related to Gfarm (e.g. gfhost) exist.
GFARM_BINDIR=/usr/bin

# --prefix directory which was specified by config-gfarm
# This value is the default value when config-gfarm is run without --prefix.
GFMD_CONFIG_PREFIX=/

# Configuration file for gfmd.
GFMD_CONF_FILE=$GFMD_CONFIG_PREFIX/etc/gfmd.conf

# PID file for the PostgreSQL daemon
POSTGRES_PID_FILE=$GFMD_CONFIG_PREFIX/var/gfarm-pgsql/postmaster.pid

# UNIX user privilege which is used by the PostgreSQL daemon
POSTGRES_USER=postgres

# Syslog file which logs messages reported by gfmd, gfsd and gfarm2fs.
GFARM_SYSLOG_FILE=/var/log/messages

# Installation prefix of Zabbix.
# A Zabbix agent executable is expected under
# ${ZABBIX_PREFIX}/sbin/.
ZABBIX_PREFIX=/usr

# Path to the Zabbix agent executable.
# (optional: Leave empty for auto-detection.)
ZABBIX_AGENT_BIN=

# Zabbix Agent user configuration directory.
# (optional: Leave empty for auto-detection.)
ZABBIX_AGENT_CONFDIR=

# Home directory of the 'zabbix' user.
ZABBIX_HOMEDIR=/var/lib/zabbix

# Directory where Zabbix external scripts reside.
ZABBIX_EXTSCRIPTDIR=/usr/lib/zabbix/externalscripts

# Gfarm-Zabbix configuration directory.
# This directory stores configuration files used by
# Gfarm-Zabbix external scripts (e.g. gfarm_conf.inc).
ZABBIX_GFARM_CONFDIR=/etc/zabbix/gfarm

# syslog facility to report errors by gfarm_zabbix.
ZABBIX_SYSLOG_FACILITY=local0
