          key: 'log[{$GFMD_LOGFILE},"\sgfmd\[[0-9]+\]:\s+<err>",UTF-8]'
          delay: '600'
          history: 30d
          value_type: LOG
          trends: '0'
          description: 'Error message in log file $1'
          tags:
            - tag: Application
              value: 'Gfarm gfmd'
          triggers:
            - uuid: d617e67796984b80bf4f884ef6d6a242
              expression: '((find(/Template_Gfarm_gfmd/log[{$GFMD_LOGFILE},"\sgfmd\[[0-9]+\]:\s+<err>",UTF-8],,"regexp","\\[1003762\\]"))<>0) and ((nodata(/Template_Gfarm_gfmd/log[{$GFMD_LOGFILE},"\sgfmd\[[0-9]+\]:\s+<err>",UTF-8],{$MULTIPLE_EVENTS_TIMEOUT}))=0)'
              name: 'gfmd checksum error in {$GFMD_LOGFILE} on {HOSTNAME}'
