              type: MULTIPLE
            - uuid: a48d977bd6dc43ceb1f2faba5a985649
              expression: '((find(/Template_Gfarm_gfmd/log[{$GFMD_LOGFILE},"\sgfmd\[[0-9]+\]:\s+<err>",UTF-8],,"regexp","err"))<>0) and ((nodata(/Template_Gfarm_gfmd/log[{$GFMD_LOGFILE},"\sgfmd\[[0-9]+\]:\s+<err>",UTF-8],{$NODATA_TIMEOUT}))=0)'
